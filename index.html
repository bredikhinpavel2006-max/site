<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casino</title>

<style>
body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:#0b0f1a;
  color:#fff;
}

.wrap{
  max-width:1000px;
  margin:0 auto;
  padding:40px 20px;
}

.title{
  text-align:center;
  font-size:40px;
  font-weight:700;
  animation:fadeDown 1s ease;
}

.sub{
  text-align:center;
  color:#94a3b8;
  margin-bottom:40px;
  animation:fadeDown 1.2s ease;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
}

.card{
  background:#111827;
  border-radius:20px;
  padding:20px;
  border:1px solid rgba(255,255,255,0.05);
  transition:.3s;
  animation:float 4s ease-in-out infinite;
}

.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
}

.img{
  height:220px;
  border-radius:15px;
  background-size:cover;
  background-position:center;
  transition:.4s;
}

.card:hover .img{
  transform:scale(1.05);
}

h2{
  margin:15px 0 10px;
}

p{
  color:#9ca3af;
}

/* КНОПКИ ПОД СТИЛЬ КАРТИНОК */

.btn{
  display:block;
  text-align:center;
  padding:14px;
  margin-top:15px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  color:#fff;
  transition:.2s;
}

/* BEEF — мягкий красный */
.beef{
  background:linear-gradient(90deg,#b91c1c,#ef4444);
  animation:glowRed 2.5s ease-in-out infinite;
}

/* EVA — мягкий фиолетовый */
.eva{
  background:linear-gradient(90deg,#6366f1,#8b5cf6);
  animation:glowPurple 2.5s ease-in-out infinite;
}

.btn:hover{
  transform:scale(1.05);
}

/* АНИМАЦИИ */

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

@keyframes glowRed{
  0%,100%{box-shadow:0 0 15px rgba(239,68,68,0.3)}
  50%{box-shadow:0 0 30px rgba(239,68,68,0.6)}
}

@keyframes glowPurple{
  0%,100%{box-shadow:0 0 15px rgba(139,92,246,0.3)}
  50%{box-shadow:0 0 30px rgba(139,92,246,0.6)}
}

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="wrap">

  <div class="title">Выбери казино</div>
  <div class="sub">Только топ варианты</div>

  <div class="grid">

    <!-- BEEF -->
    <div class="card" onclick="window.open('https://example1.com','_blank')">
      <div class="img" style="background-image:url('beef.jpg')"></div>
      <h2>BEEF</h2>
      <p>Агрессивный стиль и быстрые выплаты</p>
      <a class="btn beef" href="https://example1.com" target="_blank">Перейти</a>
    </div>

    <!-- EVA -->
    <div class="card" onclick="window.open('https://example2.com','_blank')">
      <div class="img" style="background-image:url('eva.jpg')"></div>
      <h2>EVA</h2>
      <p>Бонусы и ежедневные акции</p>
      <a class="btn eva" href="https://example2.com" target="_blank">Перейти</a>
    </div>

  </div>

</div>

</body>
</html>
