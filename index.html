<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casino</title>

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#070b14;
  color:#fff;
  overflow-x:hidden;
}

/* мягкий фон под картинки */
body::before{
  content:'';
  position:fixed;
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(255,60,60,0.15), transparent 70%);
  top:10%;
  left:10%;
  filter:blur(120px);
}

body::after{
  content:'';
  position:fixed;
  width:600px;
  height:600px;
  background:radial-gradient(circle, rgba(140,90,255,0.15), transparent 70%);
  bottom:10%;
  right:10%;
  filter:blur(120px);
}

.wrap{
  max-width:1100px;
  margin:0 auto;
  padding:60px 20px;
}

.title{
  text-align:center;
  font-size:48px;
  font-weight:800;
}

.sub{
  text-align:center;
  color:#94a3b8;
  margin-bottom:50px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  gap:30px;
}

/* КАРТОЧКА */
.card{
  position:relative;
  border-radius:24px;
  overflow:hidden;
  cursor:pointer;
  transition:.4s;
  animation:float 4s ease-in-out infinite;
}

/* КАРТИНКА НА ВЕСЬ БЛОК */
.card img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* затемнение снизу */
.overlay{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  padding:25px;
  background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
}

/* текст */
.overlay h2{
  margin:0;
  font-size:28px;
}

.overlay p{
  margin:8px 0 15px;
  color:#cbd5e1;
}

/* кнопка */
.btn{
  display:block;
  text-align:center;
  padding:14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  background:linear-gradient(90deg,#6366f1,#8b5cf6);
  color:#fff;
  animation:glow 2.5s ease-in-out infinite;
}

.card:hover{
  transform:translateY(-10px) scale(1.02);
}

/* анимации */
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

@keyframes glow{
  0%,100%{box-shadow:0 0 15px rgba(139,92,246,0.3)}
  50%{box-shadow:0 0 30px rgba(139,92,246,0.6)}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="title">Выбери казино</div>
  <div class="sub">Только топ варианты</div>

  <div class="grid">

    <!-- BEEF -->
    <div class="card" onclick="window.open('https://example1.com','_blank')">
      <img src="beef.jpg">
      <div class="overlay">
        <h2>BEEF</h2>
        <p>Агрессивный стиль и быстрые выплаты</p>
        <a class="btn" href="https://example1.com" target="_blank">Перейти</a>
      </div>
    </div>

    <!-- EVA -->
    <div class="card" onclick="window.open('https://example2.com','_blank')">
      <img src="eva.jpg">
      <div class="overlay">
        <h2>EVA</h2>
        <p>Бонусы и ежедневные акции</p>
        <a class="btn" href="https://example2.com" target="_blank">Перейти</a>
      </div>
    </div>

  </div>

</div>

</body>
</html>
